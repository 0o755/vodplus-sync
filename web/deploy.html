<!doctype html>
<!-- 输入真实公开仓库地址后跳转官方部署页，不接触部署凭证。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>部署 VodPlus Sync</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/deploy.js"></script></head><body><main class="auth"><div class="wordmark"><b>V</b> VodPlus <span>DEPLOY</span></div><h1>部署到你的 Cloudflare</h1><p>填写已经发布此项目的公开 GitHub 仓库。Cloudflare 官方页面将创建所需资源，并要求设置初始化密钥。</p><form id="deploy-form"><label>公开 GitHub 仓库 URL<input name="repository" type="url" required placeholder="https://github.com/OWNER/REPOSITORY"></label><p class="error-text" id="error" role="alert"></p><button class="primary">生成部署入口</button></form><p id="result" hidden><a id="deploy-link" class="button primary" target="_blank" rel="noreferrer">前往 Cloudflare 部署 ↗</a></p><small>仅需 Cloudflare 免费账户与 D1，无需开通 R2。此入口不会创建 GitHub 仓库，也不会读取你的部署密钥。</small></main></body></html>
