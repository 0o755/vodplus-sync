<!doctype html>
<!-- 独立分享入口不建立管理员或设备会话。 -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>读取配置 · VodPlus</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/share.js"></script></head><body><main class="auth"><div class="wordmark"><b>V</b> VodPlus <span>SHARE</span></div><h1>访问分享配置</h1><p>输入分享密码，获取可粘贴到 App 的只读配置地址。</p><form id="unlock"><label>分享密码<input name="password" type="password" required autocomplete="current-password"></label><p id="error" class="error-text" role="alert"></p><button class="primary">获取配置链接</button></form><div id="result" hidden><label>配置 URL<textarea id="url" rows="5" readonly></textarea></label><button id="copy" class="primary">复制配置 URL</button><small>链接有效期 30 天。它包含只读访问凭证，请仅分享给信任的人。</small></div></main><div id="toast" role="status"></div><dialog id="modal"></dialog></body></html>
